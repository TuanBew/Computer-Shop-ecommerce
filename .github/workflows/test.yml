name: CI Tests

on:
  push:
    branches: [ feature/testing-suite, main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm install --ignore-scripts
        working-directory: server

      - name: Rebuild native modules (bcrypt)
        run: npm rebuild bcrypt
        working-directory: server

      - name: Run server unit tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: TEST_JWT_SECRET
          JWT_REFRESH_SECRET: TEST_JWT_REFRESH_SECRET
          SECRET_CRYPTO: TEST_CRYPTO_SECRET_32_CHARS_LONG
          API_KEY_GEMINI: TEST_GEMINI_KEY
          CLIENT_URL: http://localhost:5173

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Run client unit tests
        run: npm test
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3000
          VITE_CLIENT_ID: TEST_CLIENT_ID
          VITE_SECRET_CRYPTO: TEST_CRYPTO

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install --ignore-scripts
        working-directory: server

      - name: Rebuild native modules (bcrypt)
        run: npm rebuild bcrypt
        working-directory: server

      - name: Run integration tests
        run: npm run test:integration
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: TEST_JWT_SECRET
          JWT_REFRESH_SECRET: TEST_JWT_REFRESH_SECRET
          SECRET_CRYPTO: TEST_CRYPTO_SECRET_32_CHARS_LONG
          API_KEY_GEMINI: TEST_GEMINI_KEY
          CLIENT_URL: http://localhost:5173

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies (Playwright)
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install server dependencies
        run: npm install --ignore-scripts
        working-directory: server

      - name: Rebuild native modules
        run: npm rebuild bcrypt
        working-directory: server

      - name: Start server
        run: node src/server.js &
        working-directory: server
        env:
          CONNECT_DB: mongodb://localhost:27017/computer-shop-e2e
          JWT_SECRET: TEST_JWT_SECRET
          JWT_REFRESH_SECRET: TEST_JWT_REFRESH_SECRET
          SECRET_CRYPTO: TEST_CRYPTO_SECRET_32_CHARS_LONG
          API_KEY_GEMINI: TEST_GEMINI_KEY
          CLIENT_URL: http://localhost:5173
          PORT: 3000

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3000
          VITE_CLIENT_ID: TEST_CLIENT_ID
          VITE_SECRET_CRYPTO: TEST_CRYPTO

      - name: Serve client build
        run: npx serve -s dist -p 5173 &
        working-directory: client

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3000 http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
